[package]
name = "sweepr"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Monitor, clean, analyze and maintain your Mac from the terminal"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
glob = "0.3.4"
libc = "0.2.190"
plist = "1.10.1"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.39.6"

[[bin]]
name = "sweepr"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
